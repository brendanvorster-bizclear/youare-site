<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brendan Vorster — You are</title>
  <meta name="description" content="Brendan Vorster, registered psychologist. Coaching, counselling and therapy. Get in touch.">
  <meta property="og:title" content="Brendan Vorster — You are">
  <meta property="og:description" content="Registered psychologist. Coaching, counselling and therapy.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23B25B3E'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gelasio:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#F4F0E9;--ink:#22201C;--muted:#6B655B;--line:#DDD6C8;
      --accent:#B25B3E;--accent-dark:#97492F;
      --serif:'Gelasio',Georgia,'Times New Roman',serif;
      --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--bg);color:var(--ink);font-family:var(--sans);
      -webkit-font-smoothing:antialiased;line-height:1.5;min-height:100vh;
      display:flex;align-items:center;justify-content:center;padding:32px 20px;position:relative;overflow-x:hidden;}
    ::selection{background:var(--accent);color:#fff;}
    .orb{position:fixed;top:22%;left:50%;width:460px;height:460px;transform:translate(-50%,-50%);
      background:radial-gradient(circle at center,rgba(178,91,62,.16),rgba(178,91,62,.05) 42%,transparent 70%);
      border-radius:50%;pointer-events:none;animation:breathe 9s ease-in-out infinite alternate;z-index:0;}
    @keyframes breathe{from{transform:translate(-50%,-50%) scale(.94);opacity:.8;}to{transform:translate(-50%,-50%) scale(1.06);opacity:1;}}
    .card{position:relative;z-index:1;width:100%;max-width:430px;text-align:center;}
    .wm{display:inline-flex;align-items:baseline;font-family:var(--serif);letter-spacing:.01em;
      line-height:1.6;font-size:19px;color:var(--ink);}
    .wm .dot{width:.3158em;height:.3158em;border-radius:50%;background:var(--accent);
      align-self:center;transform:translateY(.0526em);margin-left:.4737em;}
    .name{font-family:var(--serif);font-weight:400;font-size:clamp(34px,9vw,44px);
      line-height:1.05;letter-spacing:-.01em;margin-top:26px;}
    .role{margin-top:14px;font-size:15px;color:var(--ink);font-weight:500;}
    .reg{margin-top:4px;font-size:12.5px;color:var(--muted);}
    .svc{margin-top:14px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);}
    .links{margin-top:30px;border-top:1px solid var(--line);}
    .links a{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
      padding:15px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);
      transition:padding .2s ease,color .2s ease;}
    .links a:hover{color:var(--accent);padding-left:10px;}
    .links .lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);}
    .links .val{font-family:var(--serif);font-size:17px;text-align:right;}
    .save{display:inline-flex;align-items:center;gap:9px;margin-top:28px;
      font-family:var(--sans);font-size:15px;color:#fff;background:var(--accent);
      border:0;cursor:pointer;padding:14px 28px;border-radius:100px;text-decoration:none;
      transition:background .25s ease,gap .25s ease;}
    .save:hover{background:var(--accent-dark);gap:13px;}
    .foot{margin-top:26px;font-size:12px;color:var(--muted);}
    .foot a{color:var(--accent);text-decoration:none;}
    @media (prefers-reduced-motion:reduce){.orb{animation:none;}}
  </style>
</head>
<body>
  <div class="orb"></div>
  <main class="card">
    <span class="wm">You are<span class="dot"></span></span>
    <h1 class="name">Brendan Vorster</h1>
    <p class="role">Registered Psychologist</p>
    <p class="reg">New Zealand Psychologists Board &middot; Reg. 90-07630</p>
    <p class="svc">Coaching &middot; Counselling &middot; Therapy</p>

    <nav class="links">
      <a href="mailto:brendan@youare.nz"><span class="lbl">Email</span><span class="val">brendan@youare.nz</span></a>
      <a href="tel:+6421390191"><span class="lbl">Call</span><span class="val">+64 21 390 191</span></a>
      <a href="https://www.youare.nz"><span class="lbl">Website</span><span class="val">youare.nz</span></a>
    </nav>

    <button class="save" id="saveBtn">Save to contacts &darr;</button>

    <p class="foot">Coaching, counselling &amp; therapy &middot; <a href="https://www.youare.nz">youare.nz</a></p>
  </main>

  <script>
    document.getElementById('saveBtn').addEventListener('click', function () {
      var vcf = [
        'BEGIN:VCARD','VERSION:3.0',
        'N:Vorster;Brendan;;;','FN:Brendan Vorster',
        'ORG:You Are','TITLE:Registered Psychologist',
        'EMAIL;type=INTERNET;type=WORK:brendan@youare.nz',
        'TEL;type=CELL:+6421390191','URL:https://www.youare.nz',
        'NOTE:Coaching, counselling and therapy. NZ Psychologists Board Reg. 90-07630',
        'END:VCARD'
      ].join('\r\n');
      var blob = new Blob([vcf], { type: 'text/vcard' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = 'Brendan-Vorster.vcf';
      document.body.appendChild(a); a.click();
      document.body.removeChild(a); URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
